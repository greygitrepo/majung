# 사용법
#   docker compose run --rm dev flutter test                 # 단위·위젯 테스트
#   docker compose run --rm release                          # Play 업로드용 .aab (업로드 키로 서명)
#   docker compose run --rm emulator bash -c "start-emulator && flutter test integration_test"
#   PC 화면에서 보기: docker compose run --rm emulator-gui   (창이 뜨면 앱 실행, 터미널에서 r=핫 리로드, q=종료)
#   실제 폰(USB): docker compose run --rm device flutter devices
services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: majung-dev:latest
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - gradle-cache:/home/dev/.gradle
      - pub-cache:/home/dev/.pub-cache
      # Gradle 이 받는 NDK·CMake 를 보존 (첫 마운트 때 이미지 내용으로 채워짐)
      - android-sdk:/opt/android-sdk
    environment:
      - TZ=Asia/Seoul

  emulator:
    extends: dev
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: emulator
    image: majung-emulator:latest
    volumes:
      - ./:/workspace
      - gradle-cache:/home/dev/.gradle
      - pub-cache:/home/dev/.pub-cache
      - android-sdk-emu:/opt/android-sdk
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${KVM_GID:-109}"  # 호스트 kvm 그룹 GID (getent group kvm)

  # 호스트 X11 화면에 에뮬레이터 창을 띄우고 앱을 실행한다.
  # 컨테이너 사용자 UID(1000)가 호스트 사용자와 같아 X 서버가 localuser 로 허용한다.
  emulator-gui:
    extends: emulator
    working_dir: /workspace/app
    environment:
      - TZ=Asia/Seoul
      - DISPLAY=${DISPLAY:-:0}
      - EMULATOR_WINDOW=1
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
    command: bash -c "start-emulator && flutter run -d emulator-5554"

  # Play 에 올릴 .aab 빌드. 업로드 키 폴더(저장소 밖)를 읽기 전용으로 붙인다.
  # 키 만들기: tools/make_upload_key.sh  (기본 위치 ~/.majung-keys, MAJUNG_KEY_DIR 로 바꿀 수 있음)
  release:
    extends: dev
    working_dir: /workspace/app
    volumes:
      - ${MAJUNG_KEY_DIR:-~/.majung-keys}:/keys:ro
    environment:
      - TZ=Asia/Seoul
      - MAJUNG_KEY_PROPERTIES=/keys/key.properties
    # --split-debug-info: Dart 디버그 정보를 앱에서 빼서 설치 크기를 약 1MB 줄인다.
    # 빠진 정보는 build/symbols 에 남는다 (오류 기록을 읽을 때만 필요, 비밀 아님).
    command: flutter build appbundle --split-debug-info=build/symbols

  device:
    extends: dev
    privileged: true
    network_mode: host
    volumes:
      - /dev/bus/usb:/dev/bus/usb
      # adb 인증 키 보존: 없으면 실행할 때마다 키가 바뀌어 휴대폰에서 매번 다시 허용해야 한다
      - adb-keys:/home/dev/.android

volumes:
  adb-keys:
  gradle-cache:
  pub-cache:
  android-sdk:
  android-sdk-emu:
