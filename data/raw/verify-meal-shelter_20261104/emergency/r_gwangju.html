<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="robots" content="noindex, nofollow">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no">
	<title>SiiRU</title>
	<link rel="shortcut icon" href="/siiru/images/favicon.png">
	<link href="/siiru/css/font.css" rel="stylesheet" type="text/css">
	<link href="/siiru/css/siiru.css" rel="stylesheet" type="text/css">
	<link type="text/css" rel="stylesheet" href="https://www.gwangju.go.kr/home/www/css/all.css">
    <link type="text/css" rel="stylesheet" href="https://www.gwangju.go.kr/home/www/css/basic.css">
	<style media="screen">
      .errorgj {margin: 100px auto; max-width: 850px; height: 320px; background: url(https://www.gwangju.go.kr/home/www/images/common/errorimage_500.png) center top no-repeat; padding: 222px 30px; background-size:200px;}
      .errorgj .errorgj_txt01 {font-size: 23px; color: #fff; margin-bottom: 18px; padding-top: 5px; text-align: center;}
      .errorgj .errorgj_txt01 span {font-weight: bold;}
      .errorgj .errorgj_txt02 {font-size: 15px; color: #afafaf; margin-bottom: 37px; line-height: 1.4; text-align: center;}
      .errorgj .errorgj_btn {text-align: center;}
      .errorgj .errorgj_btn a {background-color: #eb4141; color: #fff; padding: 8px 6%; border-radius: 5px; font-size: 20px; font-weight: bold; text-decoration: none;}
		
		@media all and (min-width:640px){
			.errorgj {margin: 200px auto; padding: 272px 30px; background-size:auto;}
			.errorgj .errorgj_txt01 {font-size: 26px;}
			.errorgj .errorgj_txt02 {font-size: 18px;}
		}
    </style>
</head>
<body>
<div class="error-wrap">
	<div class="errorgj">
        <p class="errorgj_txt01">
          잠시 후 <span>전남광주통합특별시(구)광주광역시 메인 페이지</span>로 이동됩니다.
        </p>
        <p class="errorgj_txt02">
          요청하신 페이지를 찾을 수 없습니다.<br>
          찾으시려는 페이지의 주소를 잘못 입력하였거나,<br>
          페이지 주소의 변경 또는 삭제등의 이유로 페이지를 찾을 수 없습니다.<br>
          입력하신 페이지의 주소와 경로가 정확한지<br>
          한번 더 확인 후 이용하시기 바랍니다.
        </p>
        <div class="errorgj_btn">
          <a href="https://www.gwangju.go.kr/">전남광주통합특별시(구)광주광역시 홈으로 가기</a>
        </div>
    </div>
</div>
</body>
</html>
