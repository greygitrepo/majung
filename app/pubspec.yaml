name: majung
description: "마중 - 무료급식·쉼터 지도"
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  geolocator: ^14.1.2
  http: ^1.6.0
  intl: ^0.20.3
  latlong2: ^0.10.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/data/
    - assets/icon/
    - assets/fonts/GowunDodum-OFL.txt
  # 제목용 글꼴. 크기를 줄인 버전 (tools/subset_font.py).
  fonts:
    - family: GowunDodum
      fonts:
        - asset: assets/fonts/GowunDodum-Subset.ttf
